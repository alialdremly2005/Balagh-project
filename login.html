<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>تسجيل الدخول | بلاغ</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
        }

        .auth-box {
            width: min(450px, 100%);
            padding: 35px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            backdrop-filter: blur(20px);
        }

        .auth-logo {
            text-align: center;
            font-size: 34px;
            font-weight: 900;
            color: var(--primary-light);
            margin-bottom: 10px;
        }

        .auth-title {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-title h1 {
            font-size: 28px;
            margin-bottom: 8px;
        }

        .auth-title p {
            color: var(--muted);
            font-size: 14px;
        }

        .auth-group {
            margin-bottom: 20px;
        }

        .auth-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .auth-group input {
            width: 100%;
            padding: 15px;
            border-radius: 13px;
            border: 1px solid var(--border);
            background: rgba(255,255,255,0.05);
            color: white;
            outline: none;
            font-family: inherit;
        }

        .auth-group input:focus {
            border-color: var(--primary);
        }

        .auth-button {
            width: 100%;
            border: none;
            padding: 15px;
            border-radius: 13px;
            background: linear-gradient(
                135deg,
                var(--primary),
                var(--cyan)
            );
            color: white;
            font-family: inherit;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .auth-footer {
            text-align: center;
            margin-top: 22px;
            color: var(--muted);
            font-size: 14px;
        }

        .auth-footer a {
            color: var(--primary-light);
            font-weight: bold;
        }

        .home-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: var(--muted);
        }
    </style>
</head>

<body>

    <main class="auth-page">

        <form class="auth-box" id="loginForm">

            <div class="auth-logo">
                بلاغ
            </div>

            <div class="auth-title">
                <h1>تسجيل الدخول</h1>

                <p>
                    سجّل دخولك لمتابعة بلاغاتك
                </p>
            </div>

            <div class="auth-group">

                <label for="email">
                    البريد الإلكتروني
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="example@email.com"
                    required
                >

            </div>

            <div class="auth-group">

                <label for="password">
                    كلمة المرور
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="••••••••"
                    required
                >

            </div>

            <button
                type="submit"
                class="auth-button"
            >
                تسجيل الدخول
            </button>

            <div class="auth-footer">

                ليس لديك حساب؟

                <a href="register.html">
                    إنشاء حساب
                </a>

            </div>

            <a href="index.html" class="home-link">
                ← العودة للرئيسية
            </a>

        </form>

    </main>

    <script>
        document
            .getElementById("loginForm")
            .addEventListener("submit", function(event) {

                event.preventDefault();

                alert("تم تسجيل الدخول بنجاح ✅");
                window.location.href = "dashboard.html";

            });
    </script>

</body>
</html>
